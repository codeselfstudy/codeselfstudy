# Refer for explanation to following link:
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{md,mdx,ts,js,mjs,cjs,jsx,tsx,yaml,yml,json,html,css,scss,vue,astro}"
      exclude: "CLAUDE.md"
      run: bun run prettier --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    test:
      run: bun run test
    lint:
      glob: "{apps,packages}/**/*.{ts,js,mjs,cjs,jsx,tsx,astro}"
      # bunx finds eslint via apps/web's hoisted node_modules. `bun run eslint`
      # used to work pre-workspace but stopped after Phase 1 since eslint moved
      # out of the root package. Restrict the glob to workspace packages so
      # repo-root config files (e.g. stylelint.config.mjs) don't trip ESLint,
      # which no longer has a root config after the v9+ flat-config migration.
      run: bunx eslint {push_files}
    stylelint:
      glob: "*.{css,scss}"
      run: bunx stylelint {push_files}
