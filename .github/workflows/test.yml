name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Run linters without --fix in CI; the package.json `lint` script auto-
      # fixes for local dev convenience and would silently rewrite files here.
      - name: ESLint (web)
        run: bunx eslint .
        working-directory: apps/web

      - name: Stylelint (web)
        run: bunx stylelint "**/*.{css,scss}"
        working-directory: apps/web

      # Type-check (astro check) and produce the static build so page or type
      # breakage fails the PR. The build script is `astro check && astro build`.
      - name: Build web
        run: bun run --filter web build
        env:
          # Public (client-exposed) WorkOS config. The require-workos-env guard
          # fails `astro build` when these are empty; CI is not a deploy target,
          # so fall back to a placeholder when the repo Variables aren't set.
          # Real values live in .env.local for `just deploy`.
          VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID || 'client_ci_placeholder' }}
          VITE_WORKOS_API_HOSTNAME: ${{ vars.VITE_WORKOS_API_HOSTNAME || 'auth.workos.com' }}

      - name: Test web with coverage
        run: bun run --filter web test:coverage

      - name: Test api (race detector on)
        run: go test -race ./...
        working-directory: apps/api

      - name: Vet api
        run: go vet ./...
        working-directory: apps/api

      - name: ESLint (worker)
        run: bunx eslint .
        working-directory: apps/email_receiver

      # `test` runs `bunx tsc --noEmit && bun test` — typecheck + tests with the
      # worker's bunfig coverage gate.
      - name: Test worker (typecheck + coverage)
        run: bun run --filter email_receiver test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: apps/web/coverage/
          retention-days: 14
