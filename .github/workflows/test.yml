name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Run linters without --fix in CI; the package.json `lint` script auto-
      # fixes for local dev convenience and would silently rewrite files here.
      - name: ESLint (web)
        run: bunx eslint .
        working-directory: apps/web

      - name: Stylelint (web)
        run: bunx stylelint "**/*.{css,scss}"
        working-directory: apps/web

      # Type-check (astro check) and produce the static build so page or type
      # breakage fails the PR. The build script is `astro check && astro build`.
      - name: Build web
        run: bun run --filter web build

      - name: Test web with coverage
        run: bun run --filter web test:coverage

      - name: Test api (race detector on)
        run: go test -race ./...
        working-directory: apps/api

      - name: Vet api
        run: go vet ./...
        working-directory: apps/api

      # Fail the PR on any known vulnerability in the Go module or the stdlib
      # version in use. Complements Dependabot's alerts by catching them at PR time.
      - name: govulncheck api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
        working-directory: apps/api

      - name: ESLint (worker)
        run: bunx eslint .
        working-directory: apps/email_receiver

      # `test` runs `bunx tsc --noEmit && bun test` — typecheck + tests with the
      # worker's bunfig coverage gate.
      - name: Test worker (typecheck + coverage)
        run: bun run --filter email_receiver test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: apps/web/coverage/
          retention-days: 14
